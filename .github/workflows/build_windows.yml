name: Compilar Executável Windows (be EASY Print)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Habilitar Suporte Desktop Windows
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter doctor -v

      - name: Executar Script Automatizado de Build
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\build_windows.ps1

      - name: Compactar Pacote para Download Único (.zip)
        shell: pwsh
        run: |
          Compress-Archive -Path dist_windows\* -DestinationPath dist_windows\be-easy-windows-x64.zip -Force

      - name: Fazer Upload do Pacote Windows como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: be-easy-print-windows-x64
          path: dist_windows/
          retention-days: 30
