name: Compilar Executável Windows (be EASY Print)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Executar Script Automatizado de Build
        shell: cmd
        run: |
          call scripts\build_windows.bat

      - name: Fazer Upload do Pacote Windows como Artefato (dist_windows)
        uses: actions/upload-artifact@v4
        with:
          name: be-easy-print-windows-x64
          path: dist_windows/
          retention-days: 30
