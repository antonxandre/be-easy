name: be_easy_app
description: "Aplicativo de Autoatendimento be EASY Print (Computador da Loja e Web App Mobile)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  file_picker: ^8.1.4
  desktop_drop: ^0.5.0
  http: ^1.2.0
  http_parser: ^4.0.2
  provider: ^6.1.2
  go_router: ^14.6.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  path: ^1.9.0
  be_easy_server:
    path: ../be_easy_server

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
